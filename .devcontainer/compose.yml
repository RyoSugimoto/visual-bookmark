services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      # プロジェクトルートをコンテナにマウント（コンテナでの変更を優先 & ホストの同期を遅延）
      - ..:/workspace:cached
      # node_modules を匿名ボリューム化（永続化しない）
      - /workspace/node_modules
      # npm キャッシュを匿名ボリューム化（永続化しない）
      - /home/node/.npm
    init: true
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
    networks:
      - dev-network
    depends_on:
      - db
      - storage
      - proxy
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:password@db:5432/myapp
      - MINIO_ENDPOINT=storage.local
      - MINIO_PORT=9000 # プロキシサーバのポート番号（storageのポート番号ではない）
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_USE_SSL=false

  db:
    image: postgres:15
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: myapp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    networks:
      - dev-network

  storage:
    image: minio/minio:latest
    restart: unless-stopped
    volumes:
      - s3-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      # 外向けに公開する URL を明示的に設定する環境変数
      MINIO_SERVER_URL: http://storage.local:9000 # presign やリダイレクトに使われる
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"
    command: server /data
    expose:
      - "9000"
    networks:
      - dev-network

  proxy:
    image: nginx:alpine
    ports:
      # ホストマシンから `http://localhost:9000` でアクセス可。
      # ただし、MinIOの `Presigned URL` は、内部のサーバ名で発行されるので、
      # ブラウザからアクセスするには、
      # ホストマシンの `/etc/hosts` で、
      # 内部のサーバ名（ `nginx.conf` の `server_name` の値を参照）に
      # `127.0.0.1` を割り当てる必要がある（ホストマシンからは本来 `localhost` でしかアクセスできないため）。
      - "9000:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - storage
    networks: # 詳細を設定する場合は配列ではなくなる？
      dev-network:
        aliases:
          - storage.local # ホストマシンの `/etc/hosts` の影響を上書き

volumes:
  postgres-data:
  s3-data:

networks:
  dev-network:
